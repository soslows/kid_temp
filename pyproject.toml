[project]
name = "kid-temp"
version = "0.2.0"
description = "Дневник температуры ребёнка: измерения, график, симптомы, лекарства. Данные хранятся только на устройстве."
requires-python = ">=3.10"
dependencies = ["flet==1.1.3"]

[tool.flet]
# Идентификатор приложения для Android/AAB: ru.soslows.kidtemp
# Выбирается один раз навсегда — смена = для магазина это другое приложение.
org = "ru.soslows"
bundle_id = "ru.soslows.kidtemp"
# Имя под иконкой на телефоне
product = "Дневник температуры"
company = "soslows"
copyright = "Copyright (c) 2026 soslows"
# version_code для Android: каждая новая сборка в магазин должна быть больше
build_number = 3

[tool.flet.app]
# Не тащим в APK рабочий мусор репозитория (логи прогонов, старый интерфейс,
# макеты, тесты): у тестировщика внутри сборки должен быть только рабочий код.
exclude = [
    "build_apk.log",
    "headless_final.log",
    "headless_test.log",
    "main_old_ui.py.bak",
    "mockup",
    "restore-2026-11-23.csv",
    "test_logic.py",
    "README.md",
    "pyproject.toml",
]
