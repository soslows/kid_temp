<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kid-temp — главный экран v3</title>
<style>
  /* v3 = v1-подача (центр, иконки-капли, ссылка на сутки) + health-палитра (тонированная шкала
     от seed-оранжевого по color-systems) + нижняя навигация (v2) */
  :root{
    /* seed #FF6B3D → тонированные нейтральные (2–6%chroma к оранжевому), dark: accent 400–500 */
    --bg:#151110;            /* off-black с тёплым подтоном */
    --surface:#221B16;
    --surface-2:#2C231C;
    --text:#F5EFE8;                          /* P ≈87% */
    --text-2:rgba(245,239,232,.62);          /* S ≈60% */
    --text-3:rgba(245,239,232,.40);          /* T ≈38% */
    --accent:#FF7A4D;                        /* чуть светлее/десатурированнее для тёмной темы */
    --on-accent:#26120A;
    --accent-surface:rgba(255,122,77,.12);   /* dark tinted container 800–900 */
    --ok:#8CC97E; --ok-surface:rgba(140,201,126,.13);
    --warn:#E5B95C; --warn-surface:rgba(229,185,92,.13);
    --divider:rgba(245,239,232,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  ::selection{background:var(--accent);color:var(--on-accent)}
  body{background:#0B0908;font-family:Roboto,system-ui,'Segoe UI',sans-serif;color:var(--text);
       display:flex;justify-content:center;padding:24px 12px;min-height:100vh}
  .screen{width:390px;max-width:100%;background:var(--bg);min-height:840px;border-radius:28px;
          border:1px solid var(--divider);display:flex;flex-direction:column;position:relative;overflow:hidden}
  .scroll{flex:1;padding:0 16px 20px}

  .bar{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 6px}
  .date{font-size:15px;font-weight:500;color:var(--text-2)}
  .icon{width:44px;height:44px;border-radius:14px;border:none;background:transparent;color:var(--text-2);
        display:flex;align-items:center;justify-content:center;cursor:pointer}
  .icon:hover{background:var(--surface-2)}
  .icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* герой — по центру (v1), один главный элемент */
  .hero{display:flex;flex-direction:column;align-items:center;padding:10px 0 18px}
  .temp{font-size:84px;font-weight:600;line-height:1;letter-spacing:-0.015em;font-variant-numeric:tabular-nums}
  .temp .unit{font-size:36px;font-weight:400;color:var(--text-2)}
  .temp-meta{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14.5px;color:var(--text-2)}
  .trend{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:500;font-variant-numeric:tabular-nums}
  .sep{color:var(--text-3)}

  /* капли-иконки из v1, но на тонированных контейнерах (health-палитра) */
  h2{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
     color:var(--text-3);margin:22px 0 8px}
  .list{background:var(--surface);border-radius:18px;overflow:hidden}
  .row{display:flex;align-items:center;gap:13px;padding:13px 15px;min-height:60px}
  .row + .row{border-top:1px solid var(--divider)}
  .drop{flex:none;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .drop.ok{background:var(--ok-surface);color:var(--ok)}
  .drop.warn{background:var(--warn-surface);color:var(--warn)}
  .grow{flex:1;min-width:0}
  .name{font-size:15.5px;font-weight:500}
  .sub{font-size:13px;color:var(--text-2);margin-top:2px;font-variant-numeric:tabular-nums}
  .status{font-size:13.5px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
  .status.ok{color:var(--ok)}
  .status.warn{color:var(--warn)}

  /* чипсы */
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
  .chip{border:1px solid var(--divider);background:transparent;color:var(--text-2);
        border-radius:11px;padding:0 16px;height:42px;font-size:14px;font-family:inherit;font-weight:500;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent-surface);border-color:transparent;color:var(--accent)}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* последние + ссылка на сутки (v1) */
  .note{font-size:13.5px;color:var(--text-2);margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
  .allhist{display:block;text-align:center;color:var(--text-2);font-size:14px;margin-top:12px;text-decoration:none;
           padding:8px;border-radius:10px}
  .allhist:hover{color:var(--accent)}
  .allhist:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* нижняя навигация (v2): 3 таба, активный с акцентом */
  .nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;
       padding:10px 8px 22px;background:var(--surface);border-top:1px solid var(--divider)}
  .tab{border:none;background:transparent;color:var(--text-3);font-family:inherit;font-size:11.5px;font-weight:500;
       display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px 14px;border-radius:12px}
  .tab[aria-current="page"]{color:var(--accent)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .safe{display:flex;justify-content:center;margin-top:8px}
  .safe i{width:110px;height:4px;border-radius:2px;background:rgba(245,239,232,.22)}
</style>
</head>
<body>
<div class="screen">
  <div class="bar">
    <span class="date">Вторник, 25 ноября</span>
    <button class="icon" aria-label="Настройки">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.5-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.4-2.6a7 7 0 0 0 2-1.2l2.5 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z"/></svg>
    </button>
  </div>

  <div class="scroll">
    <div class="hero">
      <div class="temp">38,6<span class="unit"> °C</span></div>
      <div class="temp-meta">
        <span>в 21:40</span><span class="sep">·</span>
        <span class="trend">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 17 10 11 14 15 20 7"/><path d="M14 7h6v6"/></svg>
          −0,4 за 4 ч
        </span>
      </div>
    </div>

    <h2>Лекарства</h2>
    <div class="list">
      <div class="row">
        <div class="drop ok">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z"/></svg>
        </div>
        <div class="grow"><div class="name">Нурофен</div><div class="sub">дали в 19:40 · прошло 2 ч</div></div>
        <span class="status ok">можно с 23:40</span>
      </div>
      <div class="row">
        <div class="drop warn">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></svg>
        </div>
        <div class="grow"><div class="name">Парацетамол</div><div class="sub">дали в 20:10 · прошло 1,5 ч</div></div>
        <span class="status warn">ещё 2,5 ч</span>
      </div>
    </div>

    <h2>Как ведёт себя</h2>
    <div class="chips">
      <button class="chip" aria-pressed="true">вялость</button>
      <button class="chip" aria-pressed="false">насморк</button>
      <button class="chip" aria-pressed="true">спит</button>
      <button class="chip" aria-pressed="false">кашель</button>
      <button class="chip" aria-pressed="false">не ест</button>
      <button class="chip" aria-pressed="false">рвота</button>
    </div>

    <h2>История</h2>
    <div class="list">
      <div class="row">
        <div class="grow"><div class="name">38,6 °C</div><div class="sub">21:40 · нурофен 5 мл</div></div>
        <span class="note">−0,4 с 17:30</span>
      </div>
      <div class="row">
        <div class="grow"><div class="name">39,0 °C</div><div class="sub">17:30 · парацетамол 250 мг</div></div>
      </div>
    </div>
    <a class="allhist" href="#">Вся история за сутки →</a>
  </div>

  <nav class="nav">
    <button class="tab" aria-current="page">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>
      Главная
    </button>
    <button class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19c2.5-1 3.5-6 8-6s5.5 5 8 6"/><path d="M4 12c2.5-1 3.5-6 8-6s5.5 5 8 6" opacity=".45"/></svg>
      График
    </button>
    <button class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 12h5M10 16h5"/></svg>
      Дневник
    </button>
  </nav>
</div>
</body>
</html>
