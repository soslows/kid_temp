<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kid-temp — главный экран v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161210; --surface:#211A14; --surface2:#2A2119;
    --text:#F6EFE6; --muted:#B3A493; --faint:#8A7B6A;
    --accent:#FF6B3D; --accent-ink:#20130B;
    --ok:#8FCE7A; --warn:#F2B84B; --line:#3A2E23;
    --r:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  ::selection{background:var(--accent);color:var(--accent-ink)}
  body{
    background:#0D0B09; font-family:'Manrope',sans-serif; color:var(--text);
    display:flex; justify-content:center; padding:24px 12px; min-height:100vh;
  }
  .phone{
    width:390px; max-width:100%; background:var(--bg); border-radius:36px;
    border:1px solid var(--line); padding:22px 18px 18px; display:flex; flex-direction:column; gap:18px;
  }
  /* шапка */
  header{display:flex; align-items:center; justify-content:space-between}
  .date{font-size:15px; font-weight:500; color:var(--muted)}
  .date b{color:var(--text); font-weight:700}
  .iconbtn{
    width:38px;height:38px;border-radius:12px;background:var(--surface);border:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);
  }
  .iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* герой-температура */
  .hero{display:flex;flex-direction:column;align-items:center;padding:6px 0 2px}
  .temp{
    font-family:'Unbounded';font-weight:800;font-size:88px;line-height:1;letter-spacing:-0.02em;
    color:var(--text);
  }
  .temp sup{font-size:40px;color:var(--accent);font-weight:600}
  .temp-meta{margin-top:10px;font-size:14.5px;color:var(--muted);display:flex;gap:14px;align-items:center}
  .trend{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-weight:700}
  /* кнопка */
  .cta{
    font-family:'Unbounded';font-weight:600;font-size:17px;
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--r);
    padding:19px 0;width:100%;cursor:pointer;letter-spacing:0.01em;
  }
  .cta:active{transform:translateY(1px)}
  .cta:focus-visible{outline:3px solid var(--text);outline-offset:3px}
  /* секции */
  section h2{font-size:16px;font-weight:700;margin-bottom:10px}
  /* лекарства */
  .meds{display:flex;flex-direction:column;gap:8px}
  .med{
    display:flex;align-items:center;gap:12px;background:var(--surface);
    border-radius:16px;padding:13px 14px;
  }
  .med .drop{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .med.ok .drop{background:rgba(143,206,122,.14);color:var(--ok)}
  .med.warn .drop{background:rgba(242,184,75,.13);color:var(--warn)}
  .med .name{font-weight:700;font-size:15px}
  .med .when{font-size:13px;color:var(--muted);margin-top:2px}
  .med .status{margin-left:auto;font-family:'Unbounded';font-size:12px;font-weight:600;white-space:nowrap}
  .med.ok .status{color:var(--ok)}
  .med.warn .status{color:var(--warn)}
  /* симптомы-плиточки */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:999px;padding:9px 15px;font-size:14px;font-family:'Manrope';font-weight:500;cursor:pointer;
  }
  .chip.on{background:var(--surface2);border-color:var(--accent);color:var(--text);font-weight:700}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* история */
  .last{
    display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:13px 14px;
  }
  .last .t{font-family:'Unbounded';font-size:14px;font-weight:600;color:var(--muted)}
  .last .v{font-family:'Unbounded';font-size:16px;font-weight:600}
  .last .note{font-size:13.5px;color:var(--muted);margin-left:auto;text-align:right}
  .allhist{
    display:block;text-align:center;color:var(--faint);font-size:13.5px;margin-top:10px;text-decoration:none;
  }
  .allhist:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  .foot{text-align:center;font-size:12px;color:var(--faint);padding-top:2px}
</style>
</head>
<body>
<div class="phone">

  <header>
    <div class="date"><b>Вторник</b>, 25 ноября</div>
    <button class="iconbtn" aria-label="Настройки">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.5-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.4-2.6a7 7 0 0 0 2-1.2l2.5 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z"/></svg>
    </button>
  </header>

  <div class="hero">
    <div class="temp">38,6<sup>°C</sup></div>
    <div class="temp-meta">
      <span>в 21:40</span>
      <span class="trend">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 17 10 11 14 15 20 7"/><path d="M14 7h6v6"/></svg>
        −0,4 за 4 ч
      </span>
    </div>
  </div>

  <button class="cta">+ Записать измерение</button>

  <section>
    <h2>Лекарства</h2>
    <div class="meds">
      <div class="med ok">
        <div class="drop">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z"/></svg>
        </div>
        <div><div class="name">Нурофен</div><div class="when">дали в 19:40 · прошло 2 ч</div></div>
        <div class="status">можно с 23:40</div>
      </div>
      <div class="med warn">
        <div class="drop">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></svg>
        </div>
        <div><div class="name">Парацетамол</div><div class="when">дали в 20:10 · прошло 1,5 ч</div></div>
        <div class="status">ещё 2,5 ч</div>
      </div>
    </div>
  </section>

  <section>
    <h2>Как ведёт себя</h2>
    <div class="chips">
      <button class="chip on">вялость</button>
      <button class="chip">насморк</button>
      <button class="chip on">спит</button>
      <button class="chip">кашель</button>
      <button class="chip">не ест</button>
      <button class="chip">стул</button>
    </div>
  </section>

  <section>
    <h2>История</h2>
    <div class="last">
      <span class="t">21:40</span>
      <span class="v">38,6°</span>
      <span class="note">нурофен 5 мл</span>
    </div>
    <a class="allhist" href="#">Вся история за день →</a>
  </section>

  <div class="foot">Данные хранятся только на этом устройстве</div>
</div>
</body>
</html>
